<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#ffeef2;--pa:#fff;--ink:#3a1d28;--ac:#e5527f;--so:#f6cfdc;--on:#fff}
html{font-size:15px;scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.55 Nunito,sans-serif;transition:background .4s}

button,select,input,textarea{font:inherit;color:inherit}

.rule{display:flex;gap:14px;align-items:flex-start;margin:16px 0}.rule input{width:30px;height:30px;accent-color:var(--ac);flex:none;margin-top:2px}.rule b{font:600 1.3rem Fredoka;display:block}
.welcome{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 16%,#fffaf0 0%,#ffeef2 42%,#f4d8e6 100%);display:grid;place-items:center;padding:24px;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}.welcome.hidden{opacity:0;visibility:hidden;pointer-events:none}.welcome:before,.welcome:after{content:'';position:absolute;border:1px solid #e8a9bd80;border-radius:50%;width:min(82vw,560px);aspect-ratio:1;pointer-events:none}.welcome:after{width:min(66vw,440px);border-style:dashed;transform:rotate(-18deg)}.welcome-inner{position:relative;z-index:1;text-align:center;width:min(100%,460px);padding:34px 24px 30px;border:1px solid #e8b4c7;border-radius:34px;background:#fff9f4d9;box-shadow:0 24px 70px #a75e7a20;backdrop-filter:blur(8px)}.welcome-mark{width:110px;height:110px;margin:0 auto 18px;display:grid;place-items:center;border-radius:32px;background:linear-gradient(145deg,#fff,#ffe2eb);box-shadow:inset 0 0 0 1px #f0bfd0,0 12px 30px #d67a9c26}.welcome-mark svg{width:84px;height:84px}.welcome-kicker{font:700 .76rem Nunito,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#b56b86;margin-bottom:10px}.welcome-title{font:700 clamp(2.8rem,11vw,4.4rem)/.94 Fredoka,sans-serif;letter-spacing:-.045em;color:#71344d;text-shadow:0 2px #fff,0 8px 22px #c97d9b24}.welcome-title span{display:block;color:#d65c86}.welcome-rule{width:70px;height:3px;border-radius:4px;background:linear-gradient(90deg,#f0b4c9,#d65c86,#f0b4c9);margin:22px auto 16px}.welcome-copy{color:#916477;font:1rem/1.65 Nunito,sans-serif;max-width:290px;margin:0 auto 24px}.welcome-enter{border:0!important;border-radius:999px!important;padding:14px 30px!important;background:linear-gradient(135deg,#df6b91,#c84675)!important;color:#fff!important;box-shadow:0 8px 22px #ca4f7b3d;font:700 1.05rem Nunito,sans-serif!important;min-width:190px}.welcome-foot{margin-top:18px;font:600 .76rem Nunito,sans-serif;letter-spacing:.12em;color:#b38a9b}.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ac);color:var(--on);padding:12px 20px;border-radius:20px;z-index:60;max-width:90vw;font-weight:700;box-shadow:0 6px 20px #0004}
.board{position:relative;margin-top:96px}.board .mas{position:absolute;right:14px;top:-100px;width:118px;height:120px;pointer-events:none;z-index:2}
.sheet{background:var(--pa);border:2px solid var(--so);border-radius:30px;padding:clamp(20px,5vw,48px);min-height:74vh}
.ct{border:0!important;background:none!important;font:600 1.9rem Fredoka,sans-serif!important;padding:0 0 10px!important;border-radius:0!important}
#ed{outline:none;min-height:92vh;overflow-wrap:anywhere}#ed:empty:before{content:attr(data-ph);opacity:.45}
.fr{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.fr button,.fr select{padding:6px 16px;width:auto;border-radius:99px;font-size:1rem}
.av{width:46px;height:46px;border-radius:50%;background:var(--cc);color:#fff;font:600 1.4rem Fredoka;display:flex;align-items:center;justify-content:center;flex:none}
.hr{border-top:2px solid var(--so);padding-top:12px;margin-top:12px}
.mas{overflow:visible}.mas .whole{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.6s ease-in-out infinite}.mas .hd,.mas .tail,.mas .ear,.mas .earL,.mas .earR,.mas .armL,.mas .armR,.mas .wingL,.mas .wingR,.mas .gl,.mas .gr,.mas .tuft,.mas .nose{transform-box:fill-box}
.mas .hd{transform-origin:50% 100%}.mas .eye{transform-box:fill-box;transform-origin:center;animation:bl 4.8s infinite}
.k-cat .tail{transform-origin:0 100%;animation:sw 2.6s ease-in-out infinite}.k-cat .ear{transform-origin:50% 100%;animation:tw 6s infinite}
.k-bunny .earL{transform-origin:50% 100%;animation:el 3s ease-in-out infinite}.k-bunny .earR{transform-origin:50% 100%;animation:er 3s ease-in-out infinite .5s}.k-bunny .nose{transform-origin:center;animation:nz 1.5s infinite}
.k-panda .armL{transform-origin:50% 0;animation:wv 3.4s ease-in-out infinite}.k-panda .armR{transform-origin:50% 0;animation:wv 3.4s ease-in-out infinite 1.7s reverse}
.k-owl .hd{animation:ot 7s ease-in-out infinite}.k-owl .wingL,.k-chick .wingL{transform-origin:70% 10%}.k-owl .wingR,.k-chick .wingR{transform-origin:30% 10%}
.k-axo .gl{transform-origin:100% 50%;animation:gf 1.3s ease-in-out infinite}.k-axo .gr{transform-origin:0 50%;animation:gf 1.3s ease-in-out infinite reverse}.k-axo .tail{transform-origin:0 100%;animation:sw 2.2s ease-in-out infinite}.k-axo .whole{animation:fl 4s ease-in-out infinite}
.k-chick .hd{animation:pk 5s infinite}.k-chick .tuft{transform-origin:50% 100%;animation:tf 1.8s ease-in-out infinite}.k-chick .wingL{animation:fa 2.4s infinite}.k-chick .wingR{animation:fb 2.4s infinite}
.happy .whole{animation:hop .8s ease-in-out infinite}.happy .wingL{animation:fa .3s infinite!important}.happy .wingR{animation:fb .3s infinite!important}.happy .tail{animation-duration:.6s}.sleepy .whole{animation:slp 5s ease-in-out infinite}
.typing .hd{animation:tilt .3s 3!important}.typing .armL,.typing .armR,.typing .wingL,.typing .wingR{animation:fa .2s 4!important}
.zz,.spk text{fill:var(--ac);font:700 20px Fredoka}.zz{animation:zz 3s infinite}.spk text{animation:sp 1.4s ease-in-out infinite}.spk text:nth-child(2){animation-delay:.4s}.spk text:nth-child(3){animation-delay:.8s}
@keyframes br{50%{transform:scale(1.02,.98)}}@keyframes bl{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(16deg)}}@keyframes tw{90%,100%{transform:rotate(0)}94%{transform:rotate(-9deg)}}
@keyframes el{50%{transform:rotate(-9deg)}}@keyframes er{50%{transform:rotate(9deg)}}@keyframes nz{50%{transform:scale(1.25)}}@keyframes wv{50%{transform:rotate(-24deg)}}@keyframes ot{0%,35%,100%{transform:rotate(0)}45%,60%{transform:rotate(-13deg)}75%,90%{transform:rotate(13deg)}}
@keyframes gf{50%{transform:rotate(-9deg) scaleY(1.06)}}@keyframes fl{50%{transform:translateY(-6px)}}@keyframes pk{0%,88%,100%{transform:none}92%{transform:translateY(8px) rotate(7deg)}}@keyframes tf{50%{transform:rotate(-9deg)}}
@keyframes fa{50%{transform:rotate(-28deg)}}@keyframes fb{50%{transform:rotate(28deg)}}@keyframes hop{40%{transform:translateY(-16px)}}@keyframes slp{50%{transform:translateY(3px) scale(1,.98)}}@keyframes tilt{50%{transform:rotate(-5deg)}}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}50%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}@keyframes sp{0%,100%{opacity:0;transform:translateY(8px)}50%{opacity:1;transform:translateY(-8px)}}

function pinchInit(){const [a,b]=[...P.values()];drag.mode='pinch';drag.d0=Math.hypot(b.x-a.x,b.y-a.y)||1;drag.a0=Math.atan2(b.y-a.y,b.x-a.x);drag.s0=drag.x.s||1;drag.r0=drag.x.r||0;tapE=false}
